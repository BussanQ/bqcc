{{template "shell_start" .}}
{{template "identity_strip" .}}

<section class="split-layout">
  <div class="stack">
    <form class="panel action-form" data-endpoint="/api/attestations/issue" data-toast="证明已签发" data-fill='[{"path":"attestation","target":"#field-verify-att"},{"path":"attestation","target":"#field-attach-att"}]'>
      <div class="panel-head"><svg class="icon"><use href="#i-attestations"/></svg><span class="eyebrow">签发方</span></div>
      <h2>签发独立证明对象</h2>
      <p>证明是独立对象；主体身份只通过事件附着 CID。签发后会自动填入下方验证与附着表单。</p>
      <label>主体 DID<input name="subjectId" placeholder="did:p2p:..."></label>
      <label>Claim 类型<input name="claimType" value="known"></label>
      <label>Claim 值<input name="claimValue" placeholder="例如：Alice"></label>
      <label>证据引用<input name="evidenceRef" placeholder="可选 CID 或 URL ref"></label>
      <label>有效期<input name="validFor" value="24h"></label>
      <label>输出文件<input name="outPath" placeholder="attestation.json"></label>
      <div class="form-actions"><button class="primary-button" type="submit"><svg class="icon"><use href="#i-attestations"/></svg>签发证明</button></div>
    </form>

    <form class="panel action-form" data-endpoint="/api/attestations/verify" data-toast="证明验证完成">
      <div class="panel-head"><svg class="icon"><use href="#i-check"/></svg><span class="eyebrow">验证方</span></div>
      <h2>使用签发方公开状态验证</h2>
      <label>签发方公开状态 JSON<textarea name="issuerStateJson" rows="7" placeholder="粘贴签发方 signed identity state"></textarea></label>
      <label>证明 JSON<textarea id="field-verify-att" name="attestationJson" rows="7" placeholder="粘贴 attestation JSON"></textarea></label>
      <div class="form-actions"><button class="primary-button" type="submit"><svg class="icon"><use href="#i-check"/></svg>验证证明</button></div>
    </form>
  </div>

  <aside class="panel sticky-panel">
    <form class="action-form embedded" data-endpoint="/api/attestations/attach" data-confirm="这会向主体身份追加 AttachAttestation event，并写入 CID 对象文件。继续？" data-toast="证明已附着">
      <div class="panel-head"><svg class="icon"><use href="#i-plus"/></svg><span class="eyebrow">主体身份</span></div>
      <h2>附着证明 CID</h2>
      <p>不会把证明对象嵌进 document payload，只引用 CID。</p>
      <label>证明 JSON<textarea id="field-attach-att" name="attestationJson" rows="10" placeholder="粘贴 attestation JSON"></textarea></label>
      <div class="form-actions"><button class="primary-button" type="submit"><svg class="icon"><use href="#i-plus"/></svg>附着引用</button></div>
    </form>
  </aside>
</section>

{{template "result_panel" .}}
{{template "shell_end" .}}
