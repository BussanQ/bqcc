{{template "shell_start" .}}
{{template "identity_strip" .}}

<section class="wizard-grid">
  <form class="panel action-form" data-endpoint="/api/auth/challenge">
    <span class="step-pill">1</span>
    <h2>创建 challenge</h2>
    <p>验证方生成 nonce + 过期时间，不创建服务端账号状态。</p>
    <label>身份 DID<input name="identityId" value="{{.Summary.DID}}"></label>
    <label>有效期<input name="ttl" value="5m"></label>
    <button class="primary-button" type="submit">创建 challenge</button>
  </form>

  <form class="panel action-form" data-endpoint="/api/auth/respond">
    <span class="step-pill">2</span>
    <h2>本地签名响应</h2>
    <p>持有者用有效设备 key 对 challenge 的 canonical payload 签名。</p>
    <label>Challenge JSON<textarea name="challengeJson" rows="8" placeholder="粘贴 challenge JSON"></textarea></label>
    <label>签名 key ID<input name="signerKeyId" placeholder="可选；默认使用首选设备"></label>
    <button class="primary-button" type="submit">签名 response</button>
  </form>

  <form class="panel action-form" data-endpoint="/api/auth/verify">
    <span class="step-pill">3</span>
    <h2>使用公开状态验证</h2>
    <p>验证方只使用已回放验证的公开 SignedIdentityState，不需要本地私有 identity 文件。</p>
    <label>公开状态 JSON<textarea name="stateJson" rows="8" placeholder="粘贴 signed identity state"></textarea></label>
    <label>响应 JSON<textarea name="responseJson" rows="8" placeholder="粘贴 challenge response"></textarea></label>
    <button class="primary-button" type="submit">验证 response</button>
  </form>
</section>

{{template "result_panel" .}}
{{template "shell_end" .}}
