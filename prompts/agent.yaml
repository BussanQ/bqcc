# Prompt Contract — AgentlyBq Agent
# Used as a reference for prompt structure. Actual injection happens in code.

persona:
  source: workspace/SOUL.md
  slot: info("persona")
  description: Agent identity, tone, and boundaries

instructions:
  source: workspace/AGENT.md
  slot: instruct()
  description: Operating instructions, memory rules, tool usage

user_context:
  source: workspace/USER.md
  slot: info("user_context")
  description: User identity and preferences

tools_guidance:
  source: workspace/TOOLS.md
  slot: info("tools_guidance")
  description: Tool documentation and best practices

rules:
  source: .agent/rules/*.md
  slot: info("rules")
  description: Additional rules loaded from rule files

memory:
  source: memory/MEMORY.md + memory/YYYY-MM-DD.md
  slot: info("memory")
  description: Long-term + daily memory context

skills:
  source: .agent/skills/*.json
  slot: info("available_skills")
  description: Available skill definitions
